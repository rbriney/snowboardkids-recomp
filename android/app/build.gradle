// Packages the natively built libSnowboardKidsRecompiled.so and runtime assets into an APK.
// The native library is built separately with CMake + the NDK (see android/README.md);
// set SK1_NATIVE_BUILD_DIR to that build directory (default: ../build-android).
// Adapted from the Snowboard Kids 2 Android port (kardeiro/snowboardkids2-recomp-Android).
plugins {
    id 'com.android.application'
}

def nativeBuildDir = System.getenv('SK1_NATIVE_BUILD_DIR') ?: rootProject.file('../build-android').absolutePath

android {
    namespace 'com.snowboardkids.recomp'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.snowboardkids.recomp'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.1.3'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // Optional CI signing from environment variables. Without them the release APK is left unsigned and is
        // signed afterwards with android/sign-release.ps1, which prompts for the keystore password.
        release {
            if (System.getenv('SK1_KEYSTORE_PATH')) {
                storeFile file(System.getenv('SK1_KEYSTORE_PATH'))
                storePassword System.getenv('SK1_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SK1_KEY_ALIAS')
                keyPassword System.getenv('SK1_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            // Installs alongside the release build, so testing never replaces a user's install or its data.
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
        release {
            minifyEnabled false
            if (System.getenv('SK1_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            // Fonts, rcss, images staged by the CMake StageRuntimeAssets target.
            assets.srcDirs += ["${nativeBuildDir}/assets"]
        }
    }

    packagingOptions {
        jniLibs {
            // Debug symbols are stripped from the packaged .so to keep the APK small; the unstripped library stays in
            // the native build directory for symbolising crash logs (ndk-stack / llvm-addr2line).
            useLegacyPackaging true
        }
    }
}

tasks.register('copyNativeLib', Copy) {
    from(nativeBuildDir) {
        include 'libSnowboardKidsRecompiled.so'
    }
    into layout.projectDirectory.dir('src/main/jniLibs/arm64-v8a')
    doFirst {
        if (!new File(nativeBuildDir, 'libSnowboardKidsRecompiled.so').exists()) {
            throw new GradleException("libSnowboardKidsRecompiled.so not found in ${nativeBuildDir}; build it first.")
        }
    }
}

// The controller database must sit at the root of the extracted assets (get_program_path()).
tasks.register('copyControllerDb', Copy) {
    from(rootProject.file('../recompcontrollerdb.txt'))
    into layout.projectDirectory.dir('src/main/assets')
}

preBuild.dependsOn copyNativeLib, copyControllerDb
